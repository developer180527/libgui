[package]
name = "libgui"
version = "0.1.0"
edition.workspace = true
# No GPU crate here, so this is lower than the workspace floor.
rust-version = "1.87"

[features]
default = ["theme-toml", "fontdue"]
# The built-in font backend (see `FontRasterizer` to plug in your own).
fontdue = ["dep:fontdue"]
# Parse and export TOML themes (pure data, no I/O).
theme-toml = ["dep:serde", "dep:toml"]
# Hot-reload a theme file by polling it: the only filesystem access in libgui.
theme-watch = ["theme-toml"]

[dependencies]
fontdue = { workspace = true, optional = true }
bytemuck.workspace = true
serde = { version = "1", features = ["derive"], optional = true }
toml = { version = "1", optional = true }
