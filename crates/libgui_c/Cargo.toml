[package]
name = "libgui_c"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
# No GPU crate here, so this matches libgui's own floor rather than the
# workspace's.
rust-version = "1.87"
description = "C ABI for libgui, for hosts that are not written in Rust."

[lib]
# `staticlib` for linking into a C or C++ binary, `cdylib` for loading one at
# runtime, `lib` so the Rust tests in this crate can drive the same functions
# the C side sees. This is the reason the C API is its own crate: crate-type is
# fixed in the manifest and cannot be turned on by a feature, so putting these
# on `libgui` would build all three for every Rust-only user, forever.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
libgui = { path = "../libgui" }
# The per-platform key bindings and focus policy. libgui binds no keys itself,
# so without this a text field ignores Backspace.
libgui_keymap = { path = "../libgui_keymap" }
# An expression evaluator with units: one ready-made validator for
# `libgui_validated_input`, for a host with no grammar of its own. Policy, so
# not in libgui itself.
libgui_units = { path = "../libgui_units" }
# The CPU reference renderer, for the conformance kit: a host diffs its own
# pixels against these. Pure CPU, no dependencies of its own beyond libgui.
libgui_soft = { path = "../libgui_soft" }
