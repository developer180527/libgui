[package]
name = "libgui_pad"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "A fourth libgui demo: a plain-text editor, to exercise multi-line editing and the two undo stacks against each other."

[dependencies]
libgui = { path = "../libgui" }
libgui_keymap = { path = "../libgui_keymap" }
libgui_wgpu = { path = "../libgui_wgpu" }
libgui_winit = { path = "../libgui_winit" }
wgpu.workspace = true
winit.workspace = true
pollster.workspace = true
arboard = { version = "3", default-features = false }

[dev-dependencies]
libgui_soft = { path = "../libgui_soft" }
png = "0.18"
