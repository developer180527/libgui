[package]
name = "libgui_solaris"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "A second libgui demo: a dense, Houdini/Solaris-shaped editor, to show the library carrying a real tool's worth of UI at once."

[dependencies]
libgui = { path = "../libgui" }
libgui_nodes = { path = "../libgui_nodes" }
libgui_keymap = { path = "../libgui_keymap" }
libgui_wgpu = { path = "../libgui_wgpu" }
libgui_winit = { path = "../libgui_winit" }
wgpu.workspace = true
winit.workspace = true
pollster.workspace = true

[dev-dependencies]
libgui_soft = { path = "../libgui_soft" }
png = "0.18"
