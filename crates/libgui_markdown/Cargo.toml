[package]
name = "libgui_markdown"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
# No GPU crate here, so this is lower than the workspace floor.
rust-version = "1.87"
description = "Markdown (CommonMark plus tables, strikethrough and task lists) drawn with libgui's own widgets and rich text."

[dependencies]
libgui = { path = "../libgui" }
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
libgui_soft = { path = "../libgui_soft" }
png = "0.18"
