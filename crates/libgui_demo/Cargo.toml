[package]
name = "libgui_demo"
version = "0.1.0"
edition = "2021"

[dependencies]
libgui = { path = "../libgui" }
libgui_wgpu = { path = "../libgui_wgpu" }
wgpu.workspace = true
winit.workspace = true
bytemuck.workspace = true
pollster.workspace = true

# OS clipboard on desktop; iOS gets UIPasteboard later.
[target.'cfg(not(target_os = "ios"))'.dependencies]
arboard = { version = "3", default-features = false }
