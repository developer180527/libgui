[package]
name = "libgui_demo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
libgui = { path = "../libgui", features = ["theme-watch"] }
libgui_wgpu = { path = "../libgui_wgpu" }
libgui_nodes = { path = "../libgui_nodes" }
libgui_keymap = { path = "../libgui_keymap" }
libgui_winit = { path = "../libgui_winit" }
wgpu.workspace = true
winit.workspace = true
bytemuck.workspace = true
pollster.workspace = true

# OS clipboard on desktop; iOS gets UIPasteboard later.
[target.'cfg(not(target_os = "ios"))'.dependencies]
arboard = { version = "3", default-features = false }
