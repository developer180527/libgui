[package]
name = "libgui_bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[features]
# Off by default: the counting allocator adds two atomics to every allocation,
# which would bias the timing runs toward the thing we are trying to measure.
count-allocs = []

[dependencies]
libgui = { path = "../libgui" }
