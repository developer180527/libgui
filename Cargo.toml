[workspace]
resolver = "2"
members = ["crates/libgui", "crates/libgui_winit", "crates/libgui_shaders", "crates/libgui_wgpu", "crates/libgui_demo", "crates/libgui_bench", "crates/libgui_nodes", "crates/libgui_soft", "crates/libgui_keymap", "crates/libgui_units", "crates/libgui_solaris", "crates/libgui_cut", "crates/libgui_pad", "crates/libgui_c"]

[workspace.package]
authors = ["Venu Gopal"]
license = "MIT OR Apache-2.0"
edition = "2021"
# The floor is platform-dependent and comes from dependencies, not our code:
# wgpu-hal pulls `ordered-float` (needs 1.90) through
# `wgpu-core-deps-windows-linux-android`, so Linux, Windows and Android need
# 1.90 while macOS does not pull it at all. This is the highest, so it is what
# the GPU-backed crates declare. `libgui` and `libgui_nodes` use no GPU crate
# and pin their own, lower floor.
rust-version = "1.90"

[workspace.dependencies]
wgpu = "30"
winit = "0.30"
fontdue = "0.9"
# Real shaping (ligatures, marks, contextual forms, Indic reordering).
# Optional and off by default: see libgui's `shape` feature.
rustybuzz = "0.20"
self_cell = "1"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
naga = "30"

[profile.dev.package."*"]
opt-level = 2
