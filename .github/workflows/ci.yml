name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest }
          - { name: linux-aarch64,  os: ubuntu-24.04-arm }
          - { name: windows-x86_64, os: windows-latest }
          - { name: macos-aarch64,  os: macos-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The demo links winit and wgpu, so the X11/Wayland headers must be present
      # even though CI never opens a window.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      # The performance guards only assert their wall-clock budget in release;
      # a debug build is an order of magnitude slower and says nothing.
      - run: cargo test --workspace --release --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbcommon-dev libwayland-dev libxcursor-dev libxrandr-dev libxi-dev
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # The direct-dependency allow-list is a test (`tests/boundaries.rs`); this is
  # the transitive half, which no test can see. A UI core people embed in their
  # own engine earns that by pulling in almost nothing, and a jump here should
  # be a decision somebody made on purpose rather than something a version bump
  # did quietly.
  deps:
    name: deps · transitive footprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: libgui pulls in what we agreed on
        run: |
          set -euo pipefail
          count() {
            cargo tree -p libgui -e normal --prefix none --no-dedupe "$@" \
              | sed '/^$/d' | sort -u | grep -cv '^libgui v'
          }
          bare=$(count --no-default-features)
          full=$(count)
          echo "no-default-features: $bare crates"
          echo "default features:    $full crates"
          # bare: bytemuck + its derive and the proc-macro crates behind it.
          # full: adds fontdue (rasteriser) and serde/toml (theme files).
          if [ "$bare" -gt 6 ] || [ "$full" -gt 23 ]; then
            echo "::error::libgui's dependency footprint grew (bare $bare/6, full $full/23)."
            echo "Raise the number here only when the crate is worth it; otherwise it belongs in a host crate."
            cargo tree -p libgui -e normal
            exit 1
          fi

  docs:
    name: docs · intra-doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links

  # The one `unsafe` module in the tree stores paint closures in a byte
  # buffer by hand, so its invariants are checked by a machine rather than by
  # reading: Miri runs its tests under Stacked Borrows, where a stale pointer,
  # a double drop or a misaligned read is an error rather than a segfault on
  # someone else's machine.
  miri:
    name: miri · paint_arena + C callbacks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: miri }
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri test -p libgui --lib paint_arena
      # The C ABI's re-entrancy: a dock panel draws through the host's own
      # handle while libgui holds the borrow. Whether that is *sound* is a
      # question about provenance, which no ordinary run can answer — both the
      # sound and the unsound version produce the same pixels. Miri is the only
      # thing that tells them apart, and it caught real UB here once already.
      - run: cargo miri test -p libgui_c --test abi a_panel_draws
      # A table's cells reborrow the host's handle the same way a dock panel
      # does, and nothing but a Rust test runs under Miri — so the table is
      # driven from one, or that path is checked by reading only. The painter
      # test comes along because its callback owns a real allocation and frees
      # it, which is where a double free would show.
      #
      # These are minutes each, and almost all of it is rasterising glyphs
      # under an interpreter. Keep the ones added here small for that reason.
      - run: cargo miri test -p libgui_c --test coverage a_table_builds
      - run: cargo miri test -p libgui_c --test coverage every_painter_call

  # Two floors, because the dependency graph differs by platform: wgpu-hal pulls
  # `ordered-float` (1.90) on Linux/Windows/Android but not on macOS. The
  # GPU-free crates are the ones most people embed, so their lower floor is
  # worth keeping honest separately.
  msrv-core:
    name: msrv · libgui 1.87
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p libgui -p libgui_nodes -p libgui_soft -p libgui_keymap -p libgui_units --all-targets --all-features --locked

  msrv-workspace:
    name: msrv · workspace 1.90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbcommon-dev libwayland-dev libxcursor-dev libxrandr-dev libxi-dev
      - run: cargo check --workspace --all-targets --locked

  features:
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The core is meant to build with no features at all: no I/O, no font
      # backend, no TOML. Each of these catches a missing cfg.
      - run: cargo check -p libgui --no-default-features --locked
      - run: cargo check -p libgui --no-default-features --features fontdue --locked
      # serde without TOML: a layout or palette in the app's own format.
      - run: cargo check -p libgui --no-default-features --features serde --locked
      - run: cargo check -p libgui --no-default-features --features theme-toml --locked
      - run: cargo check -p libgui --no-default-features --features theme-toml,theme-watch --locked
      - run: cargo check -p libgui --all-features --locked
      - run: cargo test -p libgui --all-features --locked

  c-abi:
    name: c abi · header compiles and links
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p libgui_c --locked
      - run: cargo build -p libgui_c --release --locked
      # The half the Rust tests cannot do: compile the committed header as C,
      # link the real static library, and check every struct is the size both
      # sides think it is. A mirror that gained a field on one side only fails
      # here rather than reading the wrong bytes in someone's application.
      - name: C smoke test (unix)
        if: runner.os != 'Windows'
        run: |
          cc -std=c11 -Wall -Wextra -Icrates/libgui_c/include \
             crates/libgui_c/tests/smoke.c \
             target/release/liblibgui_c.a \
             $([ "$RUNNER_OS" = "macOS" ] && echo "-framework CoreFoundation" || echo "-lm -lpthread -ldl") \
             -o smoke
          ./smoke assets/Inter.ttf
      # The header-only C++ wrapper: RAII guards, lambdas as paint callbacks,
      # views over the frame output. It adds nothing to the ABI, so it is
      # tested the same way — compiled against the same static library.
      - name: C++ wrapper test (unix)
        if: runner.os != 'Windows'
        run: |
          c++ -std=c++17 -Wall -Wextra -Icrates/libgui_c/include \
              crates/libgui_c/tests/smoke.cpp \
              target/release/liblibgui_c.a \
              $([ "$RUNNER_OS" = "macOS" ] && echo "-framework CoreFoundation" || echo "-lm -lpthread -ldl") \
              -o smokepp
          ./smokepp assets/Inter.ttf
      - name: C smoke test (windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /I crates\libgui_c\include crates\libgui_c\tests\smoke.c ^
             target\release\libgui_c.lib ^
             ws2_32.lib userenv.lib advapi32.lib ntdll.lib bcrypt.lib /Fe:smoke.exe
          smoke.exe assets\Inter.ttf
      - name: C++ wrapper test (windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /I crates\libgui_c\include crates\libgui_c\tests\smoke.cpp ^
             target\release\libgui_c.lib ^
             ws2_32.lib userenv.lib advapi32.lib ntdll.lib bcrypt.lib /Fe:smokepp.exe
          smokepp.exe assets\Inter.ttf

  cmake:
    name: cmake · a consumer builds and links it
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Exactly what a consuming project does: add_subdirectory, link
      # libgui::libgui, build, run. An integration nobody exercises is one
      # that has quietly drifted.
      - name: Configure and build
        run: |
          cmake -S crates/libgui_c/packaging/check -B build-cmake -DCMAKE_BUILD_TYPE=Release -DLIBGUI_ROOT=$PWD
          cmake --build build-cmake --config Release
        shell: bash
      - name: Run
        run: |
          find build-cmake -name 'smoke' -o -name 'smoke.exe' | head -1 | xargs -I{} {} assets/Inter.ttf
          find build-cmake -name 'smokepp' -o -name 'smokepp.exe' | head -1 | xargs -I{} {} assets/Inter.ttf
        shell: bash

  cross-build:
    name: builds for · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: wasm32-unknown-unknown,  os: ubuntu-latest }
          - { target: aarch64-linux-android,   os: ubuntu-latest }
          - { target: i686-unknown-linux-gnu,  os: ubuntu-latest }
          - { target: aarch64-apple-ios,       os: macos-latest }
          - { target: aarch64-apple-ios-sim,   os: macos-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
      # The core and the node editor are portable; the winit/wgpu hosts are not
      # checked here because each needs its own platform SDK.
      - run: cargo check -p libgui --target ${{ matrix.target }} --all-features --locked
      - run: cargo check -p libgui_nodes --target ${{ matrix.target }} --locked

  portability:
    name: 32-bit and big-endian
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cross --locked
      # `Id` promises the same value on every target, which is what makes a
      # saved layout portable. These run the pinned-id tests under emulation on
      # a 32-bit target and a big-endian one, which is the only real check of it.
      #
      # This has already earned its keep: on powerpc64 the pinned ids match,
      # while `std`'s DefaultHasher does not agree with them — which is exactly
      # why `Id` uses its own StableHasher rather than std's.
      - run: cross test -p libgui --no-default-features --features fontdue --target i686-unknown-linux-gnu
      - run: cross test -p libgui --no-default-features --features fontdue --target powerpc64-unknown-linux-gnu
